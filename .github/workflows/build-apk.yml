name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v5

      - name: Python 3.12 kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketlerini kur
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v4

      - name: Android SDK araçlarını kur
        run: |
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: AIDL'i bul ve PATH'e ekle
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "AIDL aranıyor..."

          AIDL_PATH=$(find "$ANDROID_HOME" -type f -name aidl 2>/dev/null | head -n 1)

          if [ -z "$AIDL_PATH" ]; then
            echo "AIDL bulunamadı!"
            find "$ANDROID_HOME" -maxdepth 5 -type f | grep -E '/aidl$' || true
            exit 1
          fi

          echo "AIDL bulundu: $AIDL_PATH"

          AIDL_DIR=$(dirname "$AIDL_PATH")

          echo "AIDL klasörü: $AIDL_DIR"

          echo "$AIDL_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Android araçlarını kontrol et
        shell: bash
        run: |
          echo "PATH=$PATH"
          echo "AIDL:"
          which aidl
          aidl --version

      - name: Android lisanslarını kabul et
        run: |
          yes | sdkmanager --licenses || true

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Buildozer spec oluştur
        run: |
          buildozer init

      - name: buildozer.spec ayarla
        run: |
          sed -i 's/^title = .*/title = Uni Not Hesaplama/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = uninothesaplama/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.hunterx/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,ico/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,kivymd/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

      - name: APK oluştur
        run: |
          buildozer -v android debug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Uni-Not-Hesaplama-APK
          path: bin/*.apk
