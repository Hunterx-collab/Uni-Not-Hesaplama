name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repositoryyi indir
        uses: actions/checkout@v5

      - name: Python 3.12 kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketlerini kur
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v4

      - name: Android SDK paketlerini kur
        run: |
          sdkmanager --update

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

      - name: SDK içeriğini kontrol et
        run: |
          echo "===== ANDROID HOME ====="
          echo "$ANDROID_HOME"

          echo "===== BUILD TOOLS ====="
          ls -la "$ANDROID_HOME/build-tools/" || true

          echo "===== TÜM AIDL DOSYALARI ====="
          find "$ANDROID_HOME" -type f -name "aidl" -print || true

          echo "===== TÜM BUILD TOOLS ARAÇLARI ====="
          find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -print || true

      - name: AIDL bul
        shell: bash
        run: |
          AIDL_PATH=$(find "$ANDROID_HOME" -type f -name "aidl" | head -n 1)

          if [ -z "$AIDL_PATH" ]; then
            echo "================================"
            echo "AIDL BULUNAMADI"
            echo "================================"
            exit 1
          fi

          echo "AIDL bulundu:"
          echo "$AIDL_PATH"

          chmod +x "$AIDL_PATH"

          AIDL_DIR=$(dirname "$AIDL_PATH")
          echo "$AIDL_DIR" >> "$GITHUB_PATH"

      - name: AIDL kontrolü
        run: |
          echo "PATH=$PATH"
          echo "AIDL konumu:"
          which aidl
          echo "AIDL sürümü:"
          aidl --version

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Buildozer spec oluştur
        run: |
          buildozer init

      - name: buildozer.spec ayarla
        run: |
          sed -i 's/^title = .*/title = Uni Not Hesaplama/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = uninothesaplama/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.hunterx/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,ico/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,kivymd/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

      - name: APK oluştur
        run: |
          buildozer -v android debug

      - name: APKyı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Uni-Not-Hesaplama-APK
          path: bin/*.apk
