name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repositoryyi indir
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketlerini kur
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libtinfo5

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Eski Buildozer cache temizle
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Buildozer spec oluştur
        run: |
          buildozer init

      - name: Buildozer ayarlarını yap
        run: |
          sed -i 's/^title = .*/title = Uni Not Hesaplama/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = uninothesaplama/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.hunterx/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,ico/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,kivymd/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

          echo "===== BUILDОZER SPEC ====="
          cat buildozer.spec

      - name: Android lisansını otomatik kabul et
        run: |
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

      - name: APK oluştur
        run: |
          buildozer -v android debug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Uni-Not-Hesaplama-APK
          path: bin/*.apk
