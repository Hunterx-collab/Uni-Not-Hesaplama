      - name: Android SDK araçlarını kur
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

      - name: Android araçlarını kontrol et
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0/" || true

          echo "AIDL aranıyor:"
          find "$ANDROID_HOME" -type f -name "aidl" -print

          AIDL=$(find "$ANDROID_HOME" -type f -name "aidl" | head -n 1)

          if [ -z "$AIDL" ]; then
            echo "HATA: AIDL bulunamadı!"
            exit 1
          fi

          echo "AIDL bulundu: $AIDL"

          chmod +x "$AIDL"

          echo "AIDL sürümü:"
          "$AIDL" --version
