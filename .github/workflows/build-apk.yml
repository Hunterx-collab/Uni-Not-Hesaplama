name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repositoryyi indir
        uses: actions/checkout@v5

      - name: Python 3.11 kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketlerini kur
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v4

      - name: Android SDK paketlerini kur
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

      - name: AIDL bul
        shell: bash
        run: |
          echo "======================================"
          echo "ANDROID SDK:"
          echo "$ANDROID_HOME"
          echo "======================================"

          echo "Build Tools 34:"
          ls -la "$ANDROID_HOME/build-tools/34.0.0/" || true

          echo "Build Tools 35:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0/" || true

          echo "======================================"
          echo "AIDL DOSYALARI:"
          echo "======================================"

          find "$ANDROID_HOME/build-tools" -type f -name "aidl" -print

          AIDL_PATH=$(find "$ANDROID_HOME/build-tools" -type f -name "aidl" | sort -V | tail -n 1)

          if [ -z "$AIDL_PATH" ]; then
            echo "AIDL BULUNAMADI!"
            exit 1
          fi

          echo "======================================"
          echo "AIDL BULUNDU:"
          echo "$AIDL_PATH"
          echo "======================================"

          chmod +x "$AIDL_PATH"

          echo "$(dirname "$AIDL_PATH")" >> "$GITHUB_PATH"

      - name: AIDL kontrol
        run: |
          echo "AIDL konumu:"
          which aidl

          echo "AIDL sürümü:"
          aidl --version

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Buildozer spec oluştur
        run: |
          buildozer init

      - name: buildozer.spec ayarla
        run: |
          sed -i 's/^title = .*/title = Uni Not Hesaplama/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = uninothesaplama/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.hunterx/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,ico/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,kivymd/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

      - name: APK oluştur
        run: |
          buildozer -v android debug

      - name: APKyı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Uni-Not-Hesaplama-APK
          path: bin/*.apk
