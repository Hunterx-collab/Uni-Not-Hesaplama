    name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Repository'yi indir
        uses: actions/checkout@v5

      - name: Python 3.12 kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketlerini kur
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v4

      - name: Android SDK araçlarını kur
        shell: bash
        run: |
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

      - name: AIDL kontrolü
        shell: bash
        run: |
          echo "======================================"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "======================================"

          echo "Build Tools klasörü:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0/" || true

          echo "AIDL aranıyor..."
          find "$ANDROID_HOME" -type f -name "aidl" -print

          AIDL_PATH=$(find "$ANDROID_HOME" -type f -name "aidl" | head -n 1)

          if [ -z "$AIDL_PATH" ]; then
            echo "======================================"
            echo "HATA: AIDL BULUNAMADI!"
            echo "======================================"
            exit 1
          fi

          echo "======================================"
          echo "AIDL BULUNDU:"
          echo "$AIDL_PATH"
          echo "======================================"

          chmod +x "$AIDL_PATH"

          AIDL_DIR=$(dirname "$AIDL_PATH")

          echo "$AIDL_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Android araçlarını kontrol et
        shell: bash
        run: |
          echo "PATH=$PATH"

          echo "ADB:"
          which adb || true

          echo "AIDL:"
          which aidl

          echo "AIDL sürümü:"
          aidl --version

      - name: Python paketlerini kur
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Buildozer spec oluştur
        shell: bash
        run: |
          buildozer init

      - name: buildozer.spec ayarla
        shell: bash
        run: |
          sed -i 's/^title = .*/title = Uni Not Hesaplama/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = uninothesaplama/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.hunterx/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,ico/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,kivymd/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

          cat buildozer.spec

      - name: Android SDK ve NDK yollarını ayarla
        shell: bash
        run: |
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/25b" >> "$GITHUB_ENV"

      - name: APK oluştur
        shell: bash
        run: |
          buildozer -v android debug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Uni-Not-Hesaplama-APK
          path: bin/*.apk
